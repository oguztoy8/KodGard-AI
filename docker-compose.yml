services:
  db:
    image: pgvector/pgvector:pg16
    container_name: kodgard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kodgard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodgard}
      POSTGRES_DB: ${POSTGRES_DB:-kodgard}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodgard} -d ${POSTGRES_DB:-kodgard}"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
