services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kodgard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kodgard}
      POSTGRES_DB: ${POSTGRES_DB:-kodgard}
    ports:
      - "${KODGARD_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kodgard} -d ${POSTGRES_DB:-kodgard}"]
      interval: 2s
      timeout: 5s
      retries: 15

  model-init:
    image: kodgard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.cli", "download-model"]
    restart: "no"
    environment:
      HF_HOME: /hf_cache
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/hf_cache

  api:
    image: kodgard-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "python -m app.db migrate && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    ports:
      - "${KODGARD_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kodgard}:${POSTGRES_PASSWORD:-kodgard}@db:5432/${POSTGRES_DB:-kodgard}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REPOS_HOST_DIR: ${REPOS_HOST_DIR:?REPOS_HOST_DIR tanimlanmali}
      REPOS_CONTAINER_DIR: /repos
      HF_HOME: /hf_cache
      REVIEW_MODEL: ${REVIEW_MODEL:-claude-sonnet-5-5}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/hf_cache
      - ${REPOS_HOST_DIR:?REPOS_HOST_DIR tanimlanmali}:/repos:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 5s

  worker:
    image: kodgard-backend:latest
    command: ["python", "-m", "app.cli", "worker", "--loop", "--interval", "5"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-kodgard}:${POSTGRES_PASSWORD:-kodgard}@db:5432/${POSTGRES_DB:-kodgard}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REPOS_HOST_DIR: ${REPOS_HOST_DIR:?REPOS_HOST_DIR tanimlanmali}
      REPOS_CONTAINER_DIR: /repos
      HF_HOME: /hf_cache
      REVIEW_MODEL: ${REVIEW_MODEL:-claude-sonnet-5-5}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-haiku-5-5}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/hf_cache
      - ${REPOS_HOST_DIR:?REPOS_HOST_DIR tanimlanmali}:/repos:ro

  frontend:
    image: kodgard-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${KODGARD_BIND:-127.0.0.1}:${FRONTEND_PORT:-5173}:8080"

volumes:
  pgdata:
  hf_cache:
